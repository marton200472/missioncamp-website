<!DOCTYPE html>
<html lang="en">

<head>
    <title>Europe Mission Camp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="components/header.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="contact.css" />
    
</head>

<body>
    <header-component></header-component>
    <div class="container">
        <div class="row mt-4">
            <div class="col-md-4 d-flex flex-column justify-content-center">
                <h1>Contact Us</h1>
                <p style="font-size: large;" class="mt-4">
                    We're happy to help! If anything's unclear or you'd like more information, please don't hesitate to reach out to us. We look forward to hearing from you!
                </p>
                <h2>E-mail</h2>
                <a class="text-light" style="font-size: x-large;" href="mailto:europe@intercp.org">uk@intercp.org</a>
            </div>
            <div class="col-md-8 my-3 my-md-0 ">
                <form>
                    <div class="row">
                        <div class="col-md">
                            <label for="firstName">First Name:</label>
                            <input name="firstName" id="firstName" type="text" class="form-control" placeholder="John" required/>
                        </div>
                        <div class="col-md">
                            <label for="lastName">Last name:</label>
                            <input name="lastName" id="lastName" type="text" class="form-control" placeholder="Doe" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input class="form-control" name="email" id="email" type="text" placeholder="me@mail.tld"  required/>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input class="form-control" name="subject" id="subject" type="text"  required/>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea class="form-control" name="message" id="message" rows="7" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-light mt-2 d-block mx-auto mx-md-0">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p class="text-center"><a href="//intercpinternational.org" target="_blank"
                class="text-light">intercpinternational.org</a></p>
    </footer>

    <script src="contact.js"></script>
</body>

</html>
